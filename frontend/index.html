<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Earnings Diff → Analyst Packet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #0f1c17;
      --bg1: #163028;
      --ink: #e8f2ec;
      --muted: #9bb5a8;
      --accent: #d4a017;
      --accent-2: #3d9b74;
      --danger: #e07a5f;
      --watch: #e9c46a;
      --info: #7eb8a2;
      --panel: rgba(22, 48, 40, 0.72);
      --line: rgba(232, 242, 236, 0.12);
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #245543 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #3a2e12 0%, transparent 50%),
        linear-gradient(165deg, var(--bg0), var(--bg1) 55%, #0c1612);
    }
    header {
      padding: 2.5rem 1.5rem 1rem;
      max-width: 1100px;
      margin: 0 auto;
      animation: rise 0.7s ease both;
    }
    header h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      margin: 0 0 0.4rem;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 0;
      color: var(--muted);
      max-width: 42rem;
      line-height: 1.5;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 1.5rem 3rem;
      display: grid;
      gap: 1.25rem;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.1rem 1.2rem 1.25rem;
      backdrop-filter: blur(8px);
      animation: rise 0.8s ease both;
    }
    section:nth-child(2) { animation-delay: 0.05s; }
    section:nth-child(3) { animation-delay: 0.1s; }
    section:nth-child(4) { animation-delay: 0.15s; }
    h2 {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.15rem;
      margin: 0 0 0.85rem;
      font-weight: 600;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem;
    }
    @media (max-width: 800px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    textarea, input, select {
      width: 100%;
      background: rgba(8, 18, 14, 0.55);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 10px;
      padding: 0.7rem 0.8rem;
      font: inherit;
    }
    textarea { min-height: 180px; resize: vertical; font-family: var(--mono); font-size: 0.82rem; line-height: 1.45; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: end;
      margin-top: 0.9rem;
    }
    .controls > div { min-width: 140px; }
    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 0.72rem 1.1rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #b8860b);
      color: #1a1405;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    button.secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      font-weight: 500;
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.05); }
    button:disabled { opacity: 0.55; cursor: wait; transform: none; }
    #log {
      font-family: var(--mono);
      font-size: 0.78rem;
      background: rgba(8, 18, 14, 0.65);
      border-radius: 10px;
      padding: 0.8rem;
      min-height: 120px;
      max-height: 220px;
      overflow: auto;
      white-space: pre-wrap;
      color: var(--info);
      border: 1px solid var(--line);
    }
    .packet-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.9rem;
    }
    .chip {
      font-size: 0.75rem;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .chip.ok { color: var(--accent-2); border-color: rgba(61,155,116,0.4); }
    .chip.bad { color: var(--danger); border-color: rgba(224,122,95,0.45); }
    .summary {
      line-height: 1.55;
      margin-bottom: 1rem;
      color: #d7ebe1;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    th, td {
      text-align: left;
      padding: 0.45rem 0.4rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .sev-critical { color: var(--danger); font-weight: 700; }
    .sev-watch { color: var(--watch); }
    .sev-info { color: var(--info); }
    .cite {
      display: block;
      margin-top: 0.25rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
    }
    .q { margin: 0 0 0.75rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--line); }
    .q strong { display: block; margin-bottom: 0.25rem; }
    .q span { color: var(--muted); font-size: 0.9rem; }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.7rem;
    }
    .metric {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.7rem 0.8rem;
      background: rgba(8, 18, 14, 0.35);
    }
    .metric .k { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .metric .v { font-family: Fraunces, Georgia, serif; font-size: 1.25rem; margin-top: 0.2rem; }
    .samples { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.6rem; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #packet.empty::before {
      content: "Run a packet to populate diffs, guidance, risks, and Street questions.";
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Earnings Diff → Analyst Packet</h1>
    <p>AgentOps Lite: extract metrics, normalize QoQ diffs, flag guidance/risk language shifts, and draft Street questions — with live SLO metrics.</p>
  </header>
  <main>
    <section>
      <h2>Inputs</h2>
      <div class="grid-2">
        <div>
          <label for="prior">Prior release</label>
          <textarea id="prior" placeholder="Paste prior-quarter earnings text…"></textarea>
        </div>
        <div>
          <label for="current">Current release</label>
          <textarea id="current" placeholder="Paste current-quarter earnings text…"></textarea>
        </div>
      </div>
      <div class="controls">
        <div>
          <label for="ticker">Ticker (optional)</label>
          <input id="ticker" placeholder="ACME" />
        </div>
        <div>
          <label for="mode">Mode</label>
          <select id="mode">
            <option value="thorough">Thorough</option>
            <option value="fast">Fast</option>
          </select>
        </div>
        <button id="runStream" type="button">Stream packet</button>
        <button id="runSync" class="secondary" type="button">Sync /v1/packet</button>
        <button id="loadAcme" class="secondary" type="button">Load ACME sample</button>
        <button id="loadNxlb" class="secondary" type="button">Load NXLB sample</button>
      </div>
    </section>

    <section>
      <h2>Stream log</h2>
      <div id="log"></div>
    </section>

    <section>
      <h2>Analyst packet</h2>
      <div id="packet" class="empty"></div>
    </section>

    <section>
      <h2>Metrics dashboard</h2>
      <div class="metrics-grid" id="metrics">
        <div class="metric"><div class="k">Runs</div><div class="v" id="m-runs">—</div></div>
        <div class="metric"><div class="k">Degrade rate</div><div class="v" id="m-degrade">—</div></div>
        <div class="metric"><div class="k">p50 e2e</div><div class="v" id="m-p50">—</div></div>
        <div class="metric"><div class="k">p95 e2e</div><div class="v" id="m-p95">—</div></div>
        <div class="metric"><div class="k">p50 TTFT</div><div class="v" id="m-ttft50">—</div></div>
        <div class="metric"><div class="k">Total $</div><div class="v" id="m-cost">—</div></div>
      </div>
      <div class="samples">
        <button id="refreshMetrics" class="secondary" type="button">Refresh metrics</button>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const logEl = $("log");
    const packetEl = $("packet");

    function log(line) {
      logEl.textContent += line + "\n";
      logEl.scrollTop = logEl.scrollHeight;
    }

    function sevClass(s) {
      return s === "critical" ? "sev-critical" : s === "watch" ? "sev-watch" : "sev-info";
    }

    function cites(list) {
      if (!list || !list.length) return "";
      return list.map(c => `<span class="cite">[${c.doc} ${c.start}:${c.end}] ${escapeHtml(c.quote)}</span>`).join("");
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }

    function renderPacket(p) {
      packetEl.classList.remove("empty");
      const chips = `
        <div class="packet-meta">
          <span class="chip">${escapeHtml(p.ticker || "—")}</span>
          <span class="chip">${escapeHtml(p.mode)}</span>
          <span class="chip ${p.degraded ? "bad" : "ok"}">${p.degraded ? "degraded" : "ok"}</span>
          <span class="chip">trace ${escapeHtml(p.trace_id.slice(0, 8))}</span>
          <span class="chip">agents: ${escapeHtml((p.agents_run || []).join(", "))}</span>
        </div>`;
      const reasons = (p.degrade_reasons || []).length
        ? `<p class="summary">${escapeHtml(p.degrade_reasons.join(" · "))}</p>` : "";
      const diffs = `
        <h3 style="font-family:Fraunces,serif;font-size:1rem;margin:1rem 0 0.4rem">Metric diffs</h3>
        <table><thead><tr><th>Metric</th><th>Prior</th><th>Current</th><th>Severity</th><th>GAAP note</th></tr></thead>
        <tbody>${(p.diffs||[]).map(d => `<tr>
          <td>${escapeHtml(d.label)}${cites(d.citations)}</td>
          <td>${escapeHtml(d.prior_value ?? "—")}</td>
          <td>${escapeHtml(d.current_value ?? "—")}</td>
          <td class="${sevClass(d.severity)}">${escapeHtml(d.severity)}</td>
          <td>${escapeHtml(d.gaap_note ?? "")}</td>
        </tr>`).join("")}</tbody></table>`;
      const guidance = `
        <h3 style="font-family:Fraunces,serif;font-size:1rem;margin:1rem 0 0.4rem">Guidance shifts</h3>
        ${(p.guidance||[]).map(g => `<div class="q"><strong class="${sevClass(g.severity)}">${escapeHtml(g.topic)} · ${escapeHtml(g.change_type)}</strong>
          <span>${escapeHtml(g.prior_language || "—")} → ${escapeHtml(g.current_language || "—")}</span>${cites(g.citations)}</div>`).join("") || "<p class='summary'>None detected.</p>"}`;
      const risks = `
        <h3 style="font-family:Fraunces,serif;font-size:1rem;margin:1rem 0 0.4rem">Risk language</h3>
        ${(p.risks||[]).map(r => `<div class="q"><strong class="${sevClass(r.severity)}">${escapeHtml(r.theme)} · ${escapeHtml(r.change_type)}</strong>
          <span>${escapeHtml(r.current_language || r.prior_language || "")}</span>${cites(r.citations)}</div>`).join("") || "<p class='summary'>None detected.</p>"}`;
      const qs = `
        <h3 style="font-family:Fraunces,serif;font-size:1rem;margin:1rem 0 0.4rem">Street questions</h3>
        ${(p.questions||[]).map(q => `<div class="q"><strong>${escapeHtml(q.question)}</strong>
          <span>${escapeHtml(q.rationale)}</span>${cites(q.citations)}</div>`).join("") || "<p class='summary'>None.</p>"}`;
      packetEl.innerHTML = chips + reasons + `<p class="summary">${escapeHtml(p.summary)}</p>` + diffs + guidance + risks + qs;
    }

    async function refreshMetrics() {
      const r = await fetch("/v1/metrics/summary");
      const m = await r.json();
      $("m-runs").textContent = m.run_count;
      $("m-degrade").textContent = (m.degrade_rate * 100).toFixed(1) + "%";
      $("m-p50").textContent = m.p50_e2e_ms != null ? Math.round(m.p50_e2e_ms) + " ms" : "—";
      $("m-p95").textContent = m.p95_e2e_ms != null ? Math.round(m.p95_e2e_ms) + " ms" : "—";
      $("m-ttft50").textContent = m.p50_ttft_ms != null ? Math.round(m.p50_ttft_ms) + " ms" : "—";
      $("m-cost").textContent = "$" + Number(m.total_cost_usd || 0).toFixed(6);
    }

    function body() {
      return {
        current_text: $("current").value,
        prior_text: $("prior").value || null,
        ticker: $("ticker").value || null,
        mode: $("mode").value,
      };
    }

    async function runSync() {
      logEl.textContent = "";
      log("POST /v1/packet …");
      $("runSync").disabled = true;
      try {
        const r = await fetch("/v1/packet", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(body()),
        });
        const p = await r.json();
        if (!r.ok) throw new Error(JSON.stringify(p));
        log("packet ok · degraded=" + p.degraded);
        renderPacket(p);
        await refreshMetrics();
      } catch (e) {
        log("error: " + e.message);
      } finally {
        $("runSync").disabled = false;
      }
    }

    async function runStream() {
      logEl.textContent = "";
      log("POST /v1/packet/stream …");
      $("runStream").disabled = true;
      try {
        const r = await fetch("/v1/packet/stream", {
          method: "POST",
          headers: {"Content-Type": "application/json", "Accept": "text/event-stream"},
          body: JSON.stringify(body()),
        });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        let event = "message";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parts = buf.split("\n\n");
          buf = parts.pop();
          for (const block of parts) {
            let data = "";
            for (const line of block.split("\n")) {
              if (line.startsWith("event:")) event = line.slice(6).trim();
              if (line.startsWith("data:")) data += line.slice(5).trim();
            }
            if (!data) continue;
            let parsed;
            try { parsed = JSON.parse(data); } catch { parsed = data; }
            log(event + " " + (typeof parsed === "string" ? parsed : JSON.stringify(parsed)));
            if (event === "packet") renderPacket(parsed);
          }
        }
        await refreshMetrics();
      } catch (e) {
        log("error: " + e.message);
      } finally {
        $("runStream").disabled = false;
      }
    }

    async function loadSample(name) {
      // Samples are served from static mount path via fetch of known demo payloads embedded below
      // for offline-friendly demo; also try /static if available.
      const map = {
        acme: {
          ticker: "ACME",
          prior: `ACME CORP (NASDAQ: ACME)
Q1 2026 Earnings Release
April 28, 2026

Acme Corp today reported financial results for the first quarter ended March 31, 2026.

Financial Highlights
- Revenue: $1,240 million, up 6% year over year
- GAAP diluted EPS: $1.12
- Non-GAAP diluted EPS: $1.35 (excludes $0.23 of stock-based compensation and amortization)
- Gross margin: 41.2%
- Operating cash flow: $210 million

Guidance
For the second quarter of 2026, Acme expects revenue of $1.26 billion to $1.30 billion and non-GAAP EPS of $1.30 to $1.38. Full-year 2026 revenue growth is expected in the mid-single digits. Management remains constructive on demand in enterprise software and cloud infrastructure.

Risk Factors
Results may be impacted by elongated enterprise sales cycles, foreign exchange volatility, and elevated customer concentration in the top ten accounts. Macro uncertainty could pressure near-term deal timing. Supply chain lead times for networking hardware remain elevated versus pre-2024 norms.

CEO Comment
"We executed well in Q1 with solid sequential momentum," said Jordan Hale, CEO. "Customers continue to prioritize productivity and AI-adjacent workloads, though buying committees remain cautious on large transformational deals."`,
          current: `ACME CORP (NASDAQ: ACME)
Q2 2026 Earnings Release
July 29, 2026

Acme Corp today reported financial results for the second quarter ended June 30, 2026.

Financial Highlights
- Revenue: $1,318 million, up 11% year over year and above the high end of prior guidance
- GAAP diluted EPS: $1.05
- Non-GAAP diluted EPS: $1.48 (excludes $0.43 of stock-based compensation, amortization, and a $0.12 restructuring charge)
- Gross margin: 39.8%
- Operating cash flow: $185 million

Guidance
For the third quarter of 2026, Acme expects revenue of $1.30 billion to $1.34 billion and non-GAAP EPS of $1.35 to $1.42. Full-year 2026 revenue growth is now expected in the high-single digits, an increase versus prior mid-single-digit commentary. Management flagged that visibility beyond one quarter remains limited.

Risk Factors
Results may be impacted by elongated enterprise sales cycles, competitive pricing pressure in mid-market cloud, foreign exchange volatility, and elevated customer concentration. A restructuring of the Americas field organization may temporarily disrupt productivity. Macro uncertainty and delayed public-sector budgets could pressure near-term deal timing. Cybersecurity insurance costs have increased following industry-wide claims activity.

CEO Comment
"Q2 revenue beat was driven by stronger-than-expected AI infrastructure attach and renewals," said Jordan Hale, CEO. "We are raising the full-year growth outlook, while remaining disciplined on spend as we restructure go-to-market in the Americas."`,
        },
        nxlb: {
          ticker: "NXLB",
          prior: `NEXUS LABS (NYSE: NXLB)
Q1 2026 Earnings Release
May 5, 2026

Nexus Labs reported first-quarter 2026 results.

Highlights
- Revenue: $482 million (+4% YoY)
- GAAP EPS: $0.41
- Non-GAAP EPS: $0.62
- R&D as % of revenue: 28%

Outlook
Nexus expects Q2 revenue of $490–$510 million and maintains a cautious stance on second-half acceleration. Gross margin guidance is 62–63%.

Risks
Dependency on a small set of hyperscale customers, wafer allocation constraints, and export-control uncertainty remain primary risks.`,
          current: `NEXUS LABS (NYSE: NXLB)
Q2 2026 Earnings Release
August 4, 2026

Nexus Labs reported second-quarter 2026 results.

Highlights
- Revenue: $528 million (+9% YoY), ahead of guidance
- GAAP EPS: $0.38
- Non-GAAP EPS: $0.71
- R&D as % of revenue: 29%

Outlook
Nexus expects Q3 revenue of $535–$555 million and now sees full-year growth in the high-single digits versus prior mid-single-digit expectations. Gross margin guidance is 61–62%, modestly lower on mix.

Risks
Hyperscale concentration, wafer allocation constraints, export-control uncertainty, and rising competitive intensity in inference accelerators. Management noted a larger-than-usual backlog of design-win qualifications that could slip into 2027.`,
        },
      };
      const s = map[name];
      $("prior").value = s.prior;
      $("current").value = s.current;
      $("ticker").value = s.ticker;
      log("Loaded " + name.toUpperCase() + " sample pair.");
    }

    $("runSync").onclick = runSync;
    $("runStream").onclick = runStream;
    $("loadAcme").onclick = () => loadSample("acme");
    $("loadNxlb").onclick = () => loadSample("nxlb");
    $("refreshMetrics").onclick = refreshMetrics;
    refreshMetrics().catch(() => {});
  </script>
</body>
</html>
